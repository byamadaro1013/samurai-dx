<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="1つの会員IDで同時に複数の場所からログインはできない。使っている方の画面でログアウトしてから入り直す" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
<title>1つの会員IDで同時に複数の場所からログインはできない。使っている方の画面でログアウトしてから入り直す</title>
<rect width="720" height="380" rx="16" fill="#f8f6f1"/>
<text x="360.0" y="46" font-size="23" fill="#1d292c" font-weight="700" text-anchor="middle">1つの会員IDで同時にログインはできない</text><rect x="60" y="90" width="200" height="130" rx="8" fill="#ffffff" stroke="#1d292c" stroke-width="2.5" /><rect x="140" y="220" width="40" height="18" fill="#1d292c"/><rect x="110" y="236" width="100" height="8" rx="4" fill="#1d292c"/><text x="160" y="140" font-size="18" fill="#657071" font-weight="700" text-anchor="middle">事務所のPC</text><text x="160" y="182" font-size="20" fill="#297162" font-weight="700" text-anchor="middle">ログイン中</text><rect x="460" y="90" width="200" height="130" rx="8" fill="#ffffff" stroke="#1d292c" stroke-width="2.5" /><rect x="540" y="220" width="40" height="18" fill="#1d292c"/><rect x="510" y="236" width="100" height="8" rx="4" fill="#1d292c"/><text x="560" y="140" font-size="18" fill="#657071" font-weight="700" text-anchor="middle">自宅のPC</text><text x="560" y="182" font-size="20" fill="#cf3927" font-weight="700" text-anchor="middle">入れない</text><line x1="280" y1="155" x2="440" y2="155" stroke="#cf3927" stroke-width="3" stroke-linecap="round"/><path d="M429.5 160.8 L440 155 L429.5 149.2" stroke="#cf3927" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="138" font-size="17" fill="#cf3927" font-weight="700" text-anchor="middle">同じID</text><rect x="60" y="280" width="600" height="64" rx="12" fill="#e3eee8" stroke="none" stroke-width="0" /><text x="360.0" y="320" font-size="20" fill="#297162" font-weight="700" text-anchor="middle">使っている方の画面でログアウトしてから入り直す</text>
</svg>
