<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="行間を固定値で詰めると上下の行の文字が重なる。文字間隔、ルビや割注、フォントの混在も重なりの原因になりやすい" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
<title>行間を固定値で詰めると上下の行の文字が重なる。文字間隔、ルビや割注、フォントの混在も重なりの原因になりやすい</title>
<rect width="720" height="400" rx="16" fill="#f8f6f1"/>
<text x="360.0" y="46" font-size="23" fill="#1d292c" font-weight="700" text-anchor="middle">行間を詰めすぎると、文字がぶつかる</text><rect x="40" y="72" width="300" height="170" rx="12" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="70" cy="102" r="14.0" fill="#297162"/><path d="M63.84 102 l4.2 4.2 l7.5600000000000005 -8.4" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="110" font-size="20" fill="#297162" font-weight="700" text-anchor="start">雛形のまま</text><text x="66" y="158" font-size="24" fill="#1d292c" font-weight="400" text-anchor="start">通知書の本文です。</text><text x="66" y="200" font-size="24" fill="#1d292c" font-weight="400" text-anchor="start">期限までにご連絡を。</text><rect x="380" y="72" width="300" height="170" rx="12" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="410" cy="102" r="14.0" fill="#cf3927"/><path d="M404.96 96.96 L415.04 107.04 M415.04 96.96 L404.96 107.04" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="434" y="110" font-size="20" fill="#cf3927" font-weight="700" text-anchor="start">行間「固定値」で詰めた</text><text x="406" y="168" font-size="24" fill="#1d292c" font-weight="400" text-anchor="start">通知書の本文です。</text><text x="406" y="184" font-size="24" fill="#cf3927" font-weight="400" text-anchor="start">期限までにご連絡を。</text><text x="360.0" y="286" font-size="19" fill="#657071" font-weight="700" text-anchor="middle">ほかに重なりやすい設定</text><rect x="42.0" y="306" width="196" height="50" rx="25" fill="#f0eee7" stroke="none" stroke-width="0" /><text x="140.0" y="338" font-size="19" fill="#1d292c" font-weight="700" text-anchor="middle">文字間隔を詰める</text><rect x="262.0" y="306" width="196" height="50" rx="25" fill="#f0eee7" stroke="none" stroke-width="0" /><text x="360.0" y="338" font-size="19" fill="#1d292c" font-weight="700" text-anchor="middle">ルビ・割注</text><rect x="482.0" y="306" width="196" height="50" rx="25" fill="#f0eee7" stroke="none" stroke-width="0" /><text x="580.0" y="338" font-size="19" fill="#1d292c" font-weight="700" text-anchor="middle">フォントの混在</text>
</svg>
