<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="「処理を中断しました」は時間をおいて再申込み。「イメージファイルの作成ができませんでした」や「文書異常」は、まず再申込みし、繰り返すなら雛形から作り直す" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
<title>「処理を中断しました」は時間をおいて再申込み。「イメージファイルの作成ができませんでした」や「文書異常」は、まず再申込みし、繰り返すなら雛形から作り直す</title>
<rect width="720" height="420" rx="16" fill="#f8f6f1"/>
<text x="360.0" y="46" font-size="23" fill="#1d292c" font-weight="700" text-anchor="middle">表示によって、最初にやることが違う</text><rect x="40" y="72" width="300" height="300" rx="14" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><text x="190" y="112" font-size="19" fill="#1d292c" font-weight="700" text-anchor="middle">「処理を中断しました」</text><text x="190" y="146" font-size="17" fill="#657071" font-weight="400" text-anchor="middle">混雑などの一時的なもの</text><line x1="190" y1="166" x2="190" y2="214" stroke="#657071" stroke-width="3" stroke-linecap="round"/><path d="M184.2 203.5 L190 214 L195.8 203.5" stroke="#657071" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="226" width="240" height="70" rx="10" fill="#e3eee8" stroke="none" stroke-width="0" /><text x="190" y="258" font-size="19" fill="#297162" font-weight="700" text-anchor="middle">時間をおいて</text><text x="190" y="284" font-size="19" fill="#297162" font-weight="700" text-anchor="middle">再申込み</text><rect x="380" y="72" width="300" height="300" rx="14" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><text x="530" y="106" font-size="18" fill="#1d292c" font-weight="700" text-anchor="middle">「イメージファイルの</text><text x="530" y="132" font-size="18" fill="#1d292c" font-weight="700" text-anchor="middle">作成ができませんでした」</text><text x="530" y="158" font-size="18" fill="#1d292c" font-weight="700" text-anchor="middle">「文書異常」</text><line x1="530" y1="172" x2="530" y2="200" stroke="#657071" stroke-width="3" stroke-linecap="round"/><path d="M524.2 189.5 L530 200 L535.8 189.5" stroke="#657071" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="206" width="240" height="52" rx="10" fill="#e3eee8" stroke="none" stroke-width="0" /><text x="530" y="240" font-size="19" fill="#297162" font-weight="700" text-anchor="middle">まず再申込み</text><text x="530" y="284" font-size="16" fill="#657071" font-weight="400" text-anchor="middle">繰り返すなら</text><line x1="530" y1="292" x2="530" y2="304" stroke="#657071" stroke-width="3" stroke-linecap="round"/><path d="M524.2 293.5 L530 304 L535.8 293.5" stroke="#657071" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="410" y="308" width="240" height="52" rx="10" fill="#fbe7dd" stroke="none" stroke-width="0" /><text x="530" y="342" font-size="19" fill="#cf3927" font-weight="700" text-anchor="middle">雛形から作り直す</text>
</svg>
