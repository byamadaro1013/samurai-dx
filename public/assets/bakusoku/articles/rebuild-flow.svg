<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="エラーが直らないときの作り直し手順。雛形をダウンロードし直し、本文をメモ帳に貼って書式を消し、雛形に貼って.docxで保存する" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
<title>エラーが直らないときの作り直し手順。雛形をダウンロードし直し、本文をメモ帳に貼って書式を消し、雛形に貼って.docxで保存する</title>
<rect width="720" height="300" rx="16" fill="#f8f6f1"/>
<text x="360.0" y="46" font-size="23" fill="#1d292c" font-weight="700" text-anchor="middle">迷ったら、雛形から作り直す</text><rect x="30.0" y="70" width="196" height="170" rx="14" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="128.0" cy="112" r="22" fill="#cf3927"/><text x="128.0" y="120" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="128.0" y="174" font-size="20" fill="#1d292c" font-weight="700" text-anchor="middle">雛形を</text><text x="128.0" y="206" font-size="20" fill="#1d292c" font-weight="700" text-anchor="middle">ダウンロードし直す</text><line x1="232.0" y1="155" x2="256.0" y2="155" stroke="#657071" stroke-width="3" stroke-linecap="round"/><path d="M245.5 160.8 L256.0 155 L245.5 149.2" stroke="#657071" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="262.0" y="70" width="196" height="170" rx="14" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="360.0" cy="112" r="22" fill="#cf3927"/><text x="360.0" y="120" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="360.0" y="174" font-size="20" fill="#1d292c" font-weight="700" text-anchor="middle">本文をメモ帳に貼り</text><text x="360.0" y="206" font-size="20" fill="#1d292c" font-weight="700" text-anchor="middle">書式を消す</text><line x1="464.0" y1="155" x2="488.0" y2="155" stroke="#657071" stroke-width="3" stroke-linecap="round"/><path d="M477.5 160.8 L488.0 155 L477.5 149.2" stroke="#657071" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="494.0" y="70" width="196" height="170" rx="14" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="592.0" cy="112" r="22" fill="#cf3927"/><text x="592.0" y="120" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="592.0" y="174" font-size="20" fill="#1d292c" font-weight="700" text-anchor="middle">雛形に貼って</text><text x="592.0" y="206" font-size="20" fill="#1d292c" font-weight="700" text-anchor="middle">.docxで保存</text><text x="360.0" y="278" font-size="17" fill="#657071" font-weight="400" text-anchor="middle">どのエラーでも、最後はこれで直ることが多い</text>
</svg>
