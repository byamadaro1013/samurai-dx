<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="アップロード前のチェック項目。3MBまで、雛形から作った.docx、ファイル名は全角20文字以内、保存場所のパスは全角100文字以内、パスワードなし、ウイルスなし" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
<title>アップロード前のチェック項目。3MBまで、雛形から作った.docx、ファイル名は全角20文字以内、保存場所のパスは全角100文字以内、パスワードなし、ウイルスなし</title>
<rect width="720" height="460" rx="16" fill="#f8f6f1"/>
<text x="360.0" y="46" font-size="23" fill="#1d292c" font-weight="700" text-anchor="middle">アップロード前のチェック</text><rect x="60" y="70" width="600" height="52" rx="10" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="90" cy="96" r="13.0" fill="#297162"/><path d="M84.28 96 l3.9 3.9 l7.0200000000000005 -7.8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="104" font-size="19" fill="#657071" font-weight="700" text-anchor="start">ファイルのサイズ</text><text x="300" y="104" font-size="20" fill="#1d292c" font-weight="700" text-anchor="start">3MBまで</text><rect x="60" y="130" width="600" height="52" rx="10" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="90" cy="156" r="13.0" fill="#297162"/><path d="M84.28 156 l3.9 3.9 l7.0200000000000005 -7.8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="164" font-size="19" fill="#657071" font-weight="700" text-anchor="start">形式</text><text x="300" y="164" font-size="20" fill="#1d292c" font-weight="700" text-anchor="start">雛形から作った .docx</text><rect x="60" y="190" width="600" height="52" rx="10" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="90" cy="216" r="13.0" fill="#297162"/><path d="M84.28 216 l3.9 3.9 l7.0200000000000005 -7.8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="224" font-size="19" fill="#657071" font-weight="700" text-anchor="start">ファイル名</text><text x="300" y="224" font-size="20" fill="#1d292c" font-weight="700" text-anchor="start">全角20文字(半角40文字)以内</text><rect x="60" y="250" width="600" height="52" rx="10" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="90" cy="276" r="13.0" fill="#297162"/><path d="M84.28 276 l3.9 3.9 l7.0200000000000005 -7.8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="284" font-size="19" fill="#657071" font-weight="700" text-anchor="start">保存場所のパス</text><text x="300" y="284" font-size="20" fill="#1d292c" font-weight="700" text-anchor="start">全角100文字(半角200文字)以内</text><rect x="60" y="310" width="600" height="52" rx="10" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="90" cy="336" r="13.0" fill="#297162"/><path d="M84.28 336 l3.9 3.9 l7.0200000000000005 -7.8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="344" font-size="19" fill="#657071" font-weight="700" text-anchor="start">パスワード</text><text x="300" y="344" font-size="20" fill="#1d292c" font-weight="700" text-anchor="start">設定しない</text><rect x="60" y="370" width="600" height="52" rx="10" fill="#ffffff" stroke="#d6d8cd" stroke-width="2" /><circle cx="90" cy="396" r="13.0" fill="#297162"/><path d="M84.28 396 l3.9 3.9 l7.0200000000000005 -7.8" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="404" font-size="19" fill="#657071" font-weight="700" text-anchor="start">ウイルス</text><text x="300" y="404" font-size="20" fill="#1d292c" font-weight="700" text-anchor="start">検知されていない</text>
