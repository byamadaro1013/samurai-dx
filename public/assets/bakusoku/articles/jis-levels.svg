<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="e内容証明で使えるのはJIS第1・第2水準の文字だけ。第3・第4水準、機種依存文字、外字は使えない" font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif">
<title>e内容証明で使えるのはJIS第1・第2水準の文字だけ。第3・第4水準、機種依存文字、外字は使えない</title>
<rect width="720" height="430" rx="16" fill="#f8f6f1"/>
<text x="360.0" y="46" font-size="23" fill="#1d292c" font-weight="700" text-anchor="middle">e内容証明で使える文字の範囲</text><rect x="60" y="70" width="600" height="54" rx="10" fill="#e3eee8" stroke="none" stroke-width="0" /><circle cx="92" cy="97" r="14.0" fill="#297162"/><path d="M85.84 97 l4.2 4.2 l7.5600000000000005 -8.4" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="105" font-size="21" fill="#1d292c" font-weight="700" text-anchor="start">JIS第1水準</text><text x="290" y="105" font-size="19" fill="#657071" font-weight="400" text-anchor="start">よく使う漢字・かな・記号</text><rect x="60" y="132" width="600" height="54" rx="10" fill="#e3eee8" stroke="none" stroke-width="0" /><circle cx="92" cy="159" r="14.0" fill="#297162"/><path d="M85.84 159 l4.2 4.2 l7.5600000000000005 -8.4" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="167" font-size="21" fill="#1d292c" font-weight="700" text-anchor="start">JIS第2水準</text><text x="290" y="167" font-size="19" fill="#657071" font-weight="400" text-anchor="start">人名・地名の漢字など(澤・齋も可)</text><rect x="60" y="194" width="600" height="54" rx="10" fill="#fbe7dd" stroke="none" stroke-width="0" /><circle cx="92" cy="221" r="14.0" fill="#cf3927"/><path d="M86.96 215.96 L97.04 226.04 M97.04 215.96 L86.96 226.04" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="120" y="229" font-size="21" fill="#1d292c" font-weight="700" text-anchor="start">第3・第4水準</text><text x="290" y="229" font-size="19" fill="#657071" font-weight="400" text-anchor="start">例: 﨑</text><rect x="60" y="256" width="600" height="54" rx="10" fill="#fbe7dd" stroke="none" stroke-width="0" /><circle cx="92" cy="283" r="14.0" fill="#cf3927"/><path d="M86.96 277.96 L97.04 288.04 M97.04 277.96 L86.96 288.04" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="120" y="291" font-size="21" fill="#1d292c" font-weight="700" text-anchor="start">機種依存文字</text><text x="290" y="291" font-size="19" fill="#657071" font-weight="400" text-anchor="start">例: ① ㈱ ㎡ Ⅱ 髙</text><rect x="60" y="318" width="600" height="54" rx="10" fill="#fbe7dd" stroke="none" stroke-width="0" /><circle cx="92" cy="345" r="14.0" fill="#cf3927"/><path d="M86.96 339.96 L97.04 350.04 M97.04 339.96 L86.96 350.04" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/><text x="120" y="353" font-size="21" fill="#1d292c" font-weight="700" text-anchor="start">外字</text><text x="290" y="353" font-size="19" fill="#657071" font-weight="400" text-anchor="start">事務所で作った字</text><text x="360.0" y="412" font-size="18" fill="#657071" font-weight="400" text-anchor="middle">緑の範囲だけ使える。赤はエラーになる</text>
</svg>
